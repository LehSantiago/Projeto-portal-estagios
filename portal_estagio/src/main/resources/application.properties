spring.application.name=portal-estagios
server.port=8080

# Opcional: lê um arquivo .env (CHAVE=VALOR) da pasta de execução. O .env NÃO vai para o Git.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL (credenciais vêm de variáveis de ambiente ou do .env; nunca ficam no código) ---
spring.datasource.url=${PORTAL_DB_URL:jdbc:postgresql://localhost:5432/portal_estagios}
spring.datasource.username=${PORTAL_DB_USER:postgres}
spring.datasource.password=${PORTAL_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# --- Administrador de demonstração (criado na inicialização, se ambas estiverem definidas) ---
portal.admin.email=${PORTAL_ADMIN_EMAIL:}
portal.admin.password=${PORTAL_ADMIN_PASSWORD:}

# --- Sessão e respostas ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
